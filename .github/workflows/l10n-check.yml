name: Localization check

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  l10n:
    if: github.repository == 'boyiad2110/forgesteel-zh-tw'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Localization guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/l10n/verify.mjs --only guard

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/l10n/verify.mjs --only lint

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/l10n/verify.mjs --only types

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/l10n/verify.mjs --only tests

      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/l10n/verify.mjs --only build

      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/l10n/verify.mjs --only audit
