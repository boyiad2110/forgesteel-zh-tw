name: Localization check

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  l10n:
    if: github.repository == 'boyiad2110/forgesteel-zh-tw'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Localization guard
        run: node scripts/l10n/check.mjs

      - name: Test
        run: npx vitest run
